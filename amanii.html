<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلتفرم پیش‌بینی دیابت</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: #3a0d12; /* قرمز خیلی تیره و مات */
    background-image: radial-gradient(circle at 50% 0%, #5c141c 0%, #3a0d12 60%, #2a090d 100%);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 18px; padding: 30px;
    width: 100%; max-width: 480px;
    border-top: 8px solid #a4161a;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
  }
  h1 { text-align: center; color: #a4161a; font-size: 22px; margin-top: 0; }
  .sub { text-align: center; color: #a05050; font-size: 13px; margin-bottom: 22px; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; color: #7b0d1e; font-size: 14px; }
  input {
    width: 100%; padding: 11px 14px; border: 2px solid #f2c4c4;
    border-radius: 10px; font-size: 15px; transition: .2s;
    background: #fff8f8;
  }
  input:focus { border-color: #c1121f; outline: none; box-shadow: 0 0 0 3px rgba(193,18,31,.15); }
  button {
    width: 100%; margin-top: 24px; padding: 14px;
    background: linear-gradient(135deg, #7b0d1e, #a4161a 60%, #c1121f);
    color: #fff; border: none; border-radius: 10px;
    font-size: 17px; font-weight: bold; cursor: pointer;
    transition: .2s;
    box-shadow: 0 8px 20px rgba(164,22,26,.35);
  }
  button:hover { opacity: .92; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  #result {
    margin-top: 22px; padding: 18px; border-radius: 12px;
    text-align: center; font-size: 17px; font-weight: bold;
    display: none;
  }
  #result.ok { display: block; background: #fff0f0; color: #9d0208; border: 2px solid #e5383b; }
  #result.bad { display: block; background: #fdecea; color: #7b0d1e; border: 2px solid #c1121f; }
  #result.error { display: block; background: #fff3cd; color: #8a6d00; border: 2px solid #e5a500; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 12px; margin-top: 8px;
    background: rgba(193,18,31,.12); color: #9d0208;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🩺 پلتفرم پیش‌بینی دیابت</h1>
  <div class="sub">مدل درخت تصمیم‌گیری بر اساس پارامترهای بالینی</div>

  <label>Glucose (گلوکز خون)</label>
  <input type="number" id="glucose" step="any" placeholder="مثال: 120">

  <label>Age (سن)</label>
  <input type="number" id="age" step="any" placeholder="مثال: 35">

  <label>BMI (شاخص توده بدنی)</label>
  <input type="number" id="bmi" step="any" placeholder="مثال: 28.5">

  <label>DiabetesPedigreeFunction (سابقه خانوادگی)</label>
  <input type="number" id="dpf" step="any" placeholder="مثال: 0.5">

  <button onclick="predict()">پیش‌بینی نتیجه</button>

  <div id="result"></div>
</div>

<script>
function predict() {
  const glucose = parseFloat(document.getElementById('glucose').value);
  const age     = parseFloat(document.getElementById('age').value);
  const bmi     = parseFloat(document.getElementById('bmi').value);
  const dpf     = parseFloat(document.getElementById('dpf').value);

  const resEl = document.getElementById('result');

  if ([glucose, age, bmi, dpf].some(v => isNaN(v))) {
    resEl.className = 'error';
    resEl.innerHTML = '⚠️ لطفاً همه مقادیر را به‌درستی وارد کنید.';
    return;
  }

  // ---- پیاده‌سازی درخت تصمیم ----
  let result;

  if (glucose <= 154) {
    if (age <= 29) {
      result = 0.0;
    } else { // age > 29
      if (bmi <= 26.700) {
        result = 0.0;
      } else { // bmi > 26.700
        if (glucose <= 101) {
          if (dpf <= 0.709) result = 0.0;
          else              result = 1.0;
        } else { // glucose > 101
          if (bmi <= 43.300) {
            if (dpf <= 0.464) result = 0.0;
            else              result = 1.0;
          } else { // bmi > 43.300
            result = 1.0;
          }
        }
      }
    }
  } else { // glucose > 154
    if (dpf <= 0.307) {
      if (dpf <= 0.287) result = 1.0;
      else              result = 0.0;
    } else { // dpf > 0.307
      result = 1.0;
    }
  }

  // ---- نمایش نتیجه ----
  if (result === 1.0) {
    resEl.className = 'bad';
    resEl.innerHTML = '🔴 نتیجه: احتمال دیابت (کلاس ۱) — Mode: 1<br><span class="badge">نیازمند بررسی پزشکی</span>';
  } else {
    resEl.className = 'ok';
    resEl.innerHTML = '🟢 نتیجه: بدون احتمال دیابت (کلاس ۰) — Mode: 0<br><span class="badge">وضعیت نرمال</span>';
  }
}
</script>
</body>
</html>
